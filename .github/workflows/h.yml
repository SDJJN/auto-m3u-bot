name: Extract, Test & Build M3U

permissions:
  contents: write

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Download HTML repo (secret h)
        env:
          REPO_URL: ${{ secrets.h }}
        run: |
          set -e
          curl -fsSL "$REPO_URL/archive/refs/heads/main.zip" -o repo.zip
          unzip -q repo.zip
          rm repo.zip
          mv */ repo

      - name: Extract + Test streams
        run: |
          cat > build.js <<'EOF'
          const fs = require("fs");
          const path = require("path");
          const { execSync } = require("child_process");

          const BASE = "repo";
          const M3U = "playlist_jpg.m3u";
          const JSON_OUT = "channels_test.json";

          let m3u = "#EXTM3U\n\n";
          const report = [];

          function curlTest(url) {
            try {
              execSync(`curl -L --max-time 10 -I "${url}"`, { stdio: "ignore" });
              return true;
            } catch {
              return false;
            }
          }

          function walk(dir) {
            for (const f of fs.readdirSync(dir)) {
              const p = path.join(dir, f);
              if (fs.statSync(p).isDirectory()) walk(p);
              else if (f.endsWith(".html")) parse(p);
            }
          }

          function parse(file) {
            const name = path.basename(file, ".html");
            const html = fs.readFileSync(file, "utf8");

            const url =
              html.match(/https?:\/\/[^"' ]+\.mpd/)?.[0] ||
              html.match(/https?:\/\/[^"' ]+\.m3u8/)?.[0];

            if (!url) return;

            const type = url.endsWith(".mpd") ? "mpd" : "m3u8";
            const working = curlTest(url);

            const drmMatch = html.match(/['"]([0-9a-fA-F]{32})['"]\s*:\s*['"]([0-9a-fA-F]{32})['"]/);

            report.push({ name, type, url, working });

            if (!working) return;

            m3u += `#EXTINF:-1,${name}\n`;

            if (drmMatch) {
              m3u += `#KODIPROP:inputstream.adaptive.license_type=clearkey\n`;
              m3u += `#KODIPROP:inputstream.adaptive.license_key=${drmMatch[1]}:${drmMatch[2]}\n`;
            }

            m3u += `${url}\n\n`;
          }

          walk(BASE);

          fs.writeFileSync(M3U, m3u);
          fs.writeFileSync(JSON_OUT, JSON.stringify(report, null, 2));
          EOF

          node build.js

      - name: Commit results
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add playlist_jpg.m3u channels_test.json
          git commit -m "Extract & test streams" || echo "No changes"
          git push
