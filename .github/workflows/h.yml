name: Extract HTML Streams → M3U (JPG Logos)

permissions:
  contents: write

on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * *'    # 08:30 AM IST
    - cron: '0 7 * * *'    # 12:30 PM IST
    - cron: '30 13 * * *'  # 07:00 PM IST

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout current repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Download HTML repo (secret h)
        env:
          REPO_URL: ${{ secrets.h }}
        run: |
          set -e
          ZIP_URL="$REPO_URL/archive/refs/heads/main.zip"
          curl -fsSL "$ZIP_URL" -o repo.zip
          unzip -q repo.zip
          rm repo.zip
          mv */ repo

      - name: Generate M3U with JPG logos
        run: |
          cat > build.js <<'EOF'
          const fs = require("fs");
          const path = require("path");

          const BASE = "repo";
          const OUT = "playlist_jpg.m3u";

          const LOGOS = {
      
              "ast": "https://logos-world.net/wp-content/uploads/2022/05/Astro-Logo-2003.png",
              "bain-sprts": "https://www.lequipe.fr/_medias/img-photo-jpg/bein-sports/1500000000349926/29:0,1458:721-640-322-75/3a6a3.jpg",
              "channel7": "https://sevenwestmedia.com.au/wp-content/uploads/2025/03/Brand-4@2x.png",
              "clife-women": "https://i.ytimg.com/vi/Oo4T6kX-SKE/hqdefault.jpg?v=6972f117",
              "criclife": "https://i.ytimg.com/vi/Oo4T6kX-SKE/hqdefault.jpg?v=6972f117",
              "criclife3": "https://i.ytimg.com/vi/Oo4T6kX-SKE/hqdefault.jpg?v=6972f117",
              "cricbuzz": "https://www.mediainfoline.com/wp-content/uploads/2025/11/cricbuzz-logo-decmbr25.jpg",
              "espn2": "https://artwork.api.espn.com/artwork/collections/airings/0829aa7d-4c0a-44bd-83c5-7748ebd12690/default?width=640&apikey=1ngjw23osgcis1i1vbj96lmfqs",
              "fox": "https://foxsports-wordpress-www-prsupports-prod.s3.amazonaws.com/uploads/sites/2/2021/03/FOX-CORP.jpg",
              "hotstr": "https://upload.wikimedia.org/wikipedia/commons/b/b6/Disney%2B_Hotstar_2024.svg",
              "hub-sports": "https://www.starhub.com/content/dam/starhub/2019/personal/entertainment/tvplus/images/tvplus-logo.png",
              "kkpk": "https://www.929peakfm.com/wp-content/uploads/2021/05/929-Peak-FM-Logo.png",
              "nz1": "https://static.wikia.nocookie.net/logopedia/images/e/e2/SkySportLogo2019.png/revision/latest?cb=20210619015201",
              "skynz1": "https://static.wikia.nocookie.net/logopedia/images/e/e2/SkySportLogo2019.png/revision/latest?cb=20210619015201",
              "pakvssa": "https://www.asports.tv/wp-content/uploads/2020/08/A-Sports-Logo.png",
              "premier-sports1": "https://d3g6oc0sv9dsl4.cloudfront.net/2024/07/11125123/PS_Logo_STACKED_4.png",
              "premier": "https://d3g6oc0sv9dsl4.cloudfront.net/2024/07/11125123/PS_Logo_STACKED_4.png",
              "premierhub2": "https://d3g6oc0sv9dsl4.cloudfront.net/2024/07/11125123/PS_Logo_STACKED_4.png",
              "premierhub3": "https://d3g6oc0sv9dsl4.cloudfront.net/2024/07/11125123/PS_Logo_STACKED_4.png",
              "shoq": "https://is1-ssl.mzstatic.com/image/thumb/Purple221/v4/56/32/c3/5632c390-ace7-1453-e88a-f0a05df26d1e/AppIcon-0-0-1x_U007emarketing-0-8-0-85-220.png/1200x630wa.jpg",
              "sliv": "https://www.sling.com/assets/images/sling-logo.png",
              "sony-max": "https://i.ytimg.com/vi/ISO_sURZC9w/maxresdefault.jpg",
              "str-sprts": "https://icon2.cleanpng.com/20180522/bwx/avqexdoee.webp",
              "str-tamil": "https://icon2.cleanpng.com/20180522/bwx/avqexdoee.webp",
              "str1-eng": "https://icon2.cleanpng.com/20180522/bwx/avqexdoee.webp",
              "str1-hindi": "https://icon2.cleanpng.com/20180522/bwx/avqexdoee.webp",
              "str1-tamil": "https://icon2.cleanpng.com/20180522/bwx/avqexdoee.webp",
              "str1": "https://icon2.cleanpng.com/20180522/bwx/avqexdoee.webp",
              "t20": "https://www.icc-cricket.com/assets/images/icc-t20-world-cup-logo.png",
              "tnt1": "https://1000logos.net/wp-content/uploads/2025/01/TNT-Logo.png",
              "tnt2": "https://1000logos.net/wp-content/uploads/2025/01/TNT-Logo.png",
              "tnt3": "https://1000logos.net/wp-content/uploads/2025/01/TNT-Logo.png",
              "tnt4": "https://1000logos.net/wp-content/uploads/2025/01/TNT-Logo.png",
              "willo-ios": "https://mma.prnewswire.com/media/1919551/WillowTV_Logo.jpg?p=facebook",
              "willo-sports": "https://mma.prnewswire.com/media/1919551/WillowTV_Logo.jpg?p=facebook",
              "willo-sports2": "https://mma.prnewswire.com/media/1919551/WillowTV_Logo.jpg?p=facebook",
              "willo": "https://mma.prnewswire.com/media/1919551/WillowTV_Logo.jpg?p=facebook",
              "zee": "https://www.bizasialive.com/wp-content/uploads/2022/01/zeetvhd004.jpg"
          };

          let out = "#EXTM3U\n\n";

          function walk(dir){
            for(const f of fs.readdirSync(dir)){
              const p = path.join(dir,f);
              if(fs.statSync(p).isDirectory()) walk(p);
              else if(f.endsWith(".html")) parse(p);
            }
          }

          function parse(file){
            const name = path.basename(file,".html");
            const html = fs.readFileSync(file,"utf8");

            const url =
              html.match(/https?:\/\/[^"' ]+\.mpd/)?.[0] ||
              html.match(/https?:\/\/[^"' ]+\.m3u8/)?.[0];

            if(!url) return;

            const drm = html.match(/['"]([0-9a-fA-F]{32})['"]\s*:\s*['"]([0-9a-fA-F]{32})['"]/);

            const logo = (LOGOS[name] || "").replace(/\.(png|svg).*$/,".jpg");

            out += `#EXTINF:-1 tvg-logo="${logo}",${name}\n`;

            if(drm){
              out += `#KODIPROP:inputstream.adaptive.license_type=clearkey\n`;
              out += `#KODIPROP:inputstream.adaptive.license_key=${drm[1]}:${drm[2]}\n`;
            }

            out += `${url}\n\n`;
          }

          walk(BASE);
          fs.writeFileSync(OUT,out);
          EOF

          node build.js

      - name: Commit playlist
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add playlist_jpg.m3u
          git commit -m "Generate M3U with JPG logos" || echo "No changes"
          git push
