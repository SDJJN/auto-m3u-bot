name: JSTAR DRM Workflow

# 🔐 REQUIRED permissions (fixes 403 push error)
permissions:
  contents: write

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */1 * * *"

jobs:
  jstar:
    runs-on: ubuntu-latest

    steps:
      # 📥 Checkout repo with write token
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      # 🛠 Build playlist (syntax-safe)
      - name: Build JSTAR DRM playlist
        shell: bash
        env:
          SRC: ${{ secrets.s }}
        run: |
          set -euo pipefail

          echo "#EXTM3U" > jstar_drm.m3u
          curl -fsSL "$SRC" > source.m3u

          extinf=""
          clearkey=""
          http=""
          url=""

          while IFS= read -r line || [ -n "$line" ]; do
            line="$(printf '%s' "$line" | tr -d '\r')"

            if [[ "$line" == "#EXTINF"* ]]; then
              extinf="$line"
              clearkey=""
              http=""
              url=""
              continue
            fi

            # Case 1: Kodi ClearKey via license_key URL
            if [[ "$line" == *"license_key=https://"* ]]; then
              keyid="$(printf '%s' "$line" | sed -n 's/.*keyid=\([^&]*\).*/\1/p')"
              key="$(printf '%s' "$line" | sed -n 's/.*key=\([^&]*\).*/\1/p')"
              if [[ -n "$keyid" && -n "$key" ]]; then
                clearkey="$keyid:$key"
              fi
              continue
            fi

            # Case 2: DRM inside URL
            if [[ "$line" == http* && "$line" == *"drmScheme=clearkey"* ]]; then
              clearkey="$(printf '%s' "$line" | sed -n 's/.*drmLicense=\([^&]*\).*/\1/p')"
              url="$line"
              continue
            fi

            if [[ "$line" == "#EXTHTTP"* ]]; then
              http="$line"
              continue
            fi

            if [[ "$line" == http* && "$line" == *".mpd"* && -z "$url" ]]; then
              url="$line"
              continue
            fi

            # ✍ Write ONLY if DRM exists
            if [[ -n "$extinf" && -n "$clearkey" && -n "$url" ]]; then
              {
                echo "$extinf"
                echo "#KODIPROP:inputstream.adaptive.license_type=clearkey"
                echo "#KODIPROP:inputstream.adaptive.license_key=$clearkey"
                echo "#EXTVLCOPT:http-user-agent=StreamFlex/7.1.3 (Linux;Android 13) StreamFlex/69.1 ExoPlayerLib/824.0"
                [[ -n "$http" ]] && echo "$http"
                echo "$url"
                echo ""
              } >> jstar_drm.m3u

              extinf=""
              clearkey=""
              http=""
              url=""
            fi
          done < source.m3u

      # 📤 Commit & push result
      - name: Commit and push changes
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"

          git add jstar_drm.m3u
          git commit -m "Auto update JSTAR DRM playlist" || echo "No changes to commit"
          git push
