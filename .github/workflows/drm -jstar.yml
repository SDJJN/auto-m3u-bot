name: JSTAR Playlist Builder

permissions:
  contents: write

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

jobs:
  jstar:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Build JSTAR playlist (structure fixed)
        shell: bash
        env:
          SRC: ${{ secrets.s }}
        run: |
          set -euo pipefail

          echo "#EXTM3U" > jstar_drm.m3u
          curl -fsSL "$SRC" > source.m3u

          extinf=""
          clearkey=""
          http=""
          url=""
          is_drm="0"

          while IFS= read -r line || [ -n "$line" ]; do
            line="$(printf '%s' "$line" | tr -d '\r')"

            # New channel
            if [[ "$line" == "#EXTINF"* ]]; then
              extinf="$line"
              clearkey=""
              http=""
              url=""
              is_drm="0"
              continue
            fi

            # Kodi ClearKey DRM
            if [[ "$line" == "#KODIPROP:inputstream.adaptive.license_key="* ]]; then
              clearkey="${line##*=}"
              is_drm="1"
              continue
            fi

            # DRM embedded in URL
            if [[ "$line" == http* && "$line" == *"drmScheme=clearkey"* ]]; then
              clearkey="$(printf '%s' "$line" | sed -n 's/.*drmLicense=\([^&]*\).*/\1/p')"
              url="$(printf '%s' "$line" | sed 's/[?&]drmScheme=clearkey//g; s/[?&]drmLicense=[^&]*//g')"
              is_drm="1"
              continue
            fi

            # HTTP headers
            if [[ "$line" == "#EXTHTTP"* ]]; then
              http="$line"
              continue
            fi

            # Normal stream URL
            if [[ "$line" == http* && -z "$url" ]]; then
              url="$line"
              continue
            fi

            # Write channel
            if [[ -n "$extinf" && -n "$url" ]]; then
              {
                echo "$extinf"

                if [[ "$is_drm" == "1" && -n "$clearkey" ]]; then
                  echo "#KODIPROP:inputstream.adaptive.license_type=clearkey"
                  echo "#KODIPROP:inputstream.adaptive.license_key=$clearkey"
                  echo "#EXTVLCOPT:http-user-agent=StreamFlex/7.1.3 (Linux;Android 13) StreamFlex/69.1 ExoPlayerLib/824.0"
                  [[ -n "$http" ]] && echo "$http"
                fi

                echo "$url"
                echo ""
              } >> jstar_drm.m3u

              extinf=""
              clearkey=""
              http=""
              url=""
              is_drm="0"
            fi
          done < source.m3u

      - name: Commit and push changes
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"

          git add jstar_drm.m3u
          git commit -m "Auto update JSTAR playlist (structure fixed)" || echo "No changes"
          git push
