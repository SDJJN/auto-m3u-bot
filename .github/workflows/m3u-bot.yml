name: Auto Update M3U (Cleaned)

on:
  schedule:
    - cron: "0 */6 * * *"   # every 6 hours (UTC)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    environment: LS

    steps:
      # 1️⃣ Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2️⃣ Download SOURCE M3U from secret LS (403 BYPASS)
      - name: Download source M3U (from LS)
        run: |
          if [ -z "$SOURCE_M3U_URL" ]; then
            echo "ERROR: LS secret is missing"
            exit 1
          fi

          echo "Downloading source M3U from secret LS..."

          curl --http1.1 -L \
            -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120 Safari/537.36" \
            -H "Accept: */*" \
            -H "Accept-Language: en-US,en;q=0.9" \
            -H "Accept-Encoding: gzip, deflate, br" \
            -H "Referer: https://ranapk.online/" \
            -H "Connection: keep-alive" \
            --compressed \
            --fail \
            "$SOURCE_M3U_URL" \
            -o source.m3u

          echo "Source M3U line count:"
          wc -l source.m3u
        env:
          SOURCE_M3U_URL: ${{ secrets.LS }}

      # 3️⃣ Clean & filter M3U (YOUR EXACT LOGIC – UNCHANGED)
      - name: Clean & filter M3U
        run: |
          awk '
          BEGIN { keep=1 }

          /RANAPK/ && !/^https?:\/\// { keep=0; next }
          /JOIN TG/ { keep=0; next }
          /Telegram/ { keep=0; next }
          /t\.me/ { keep=0; next }
          /ফাইল চুরি/ { keep=0; next }
          /END____/ { keep=0; next }

          /WELCOME/ && !/^https?:\/\// { keep=0; next }
          /Welcome/ && !/^https?:\/\// { keep=0; next }
          /welcome/ && !/^https?:\/\// { keep=0; next }
          /•.*WELCOME.*•/ { keep=0; next }
          /★.*WELCOME.*★/ { keep=0; next }
          /●.*WELCOME.*●/ { keep=0; next }
          /---.*WELCOME.*---/ { keep=0; next }

          /^#EXTINF/ {
            keep=1
            if ($0 ~ /^#EXTINF:-1[[:space:]]*$/) keep=0
            if ($0 ~ /tvg-logo=.*[Ww]elcome/) keep=0
            if ($0 ~ /tvg-logo=.*[Ww]elcomes/) keep=0
            if (keep==1) print
            next
          }

          /^https?:\/\// {
            if (keep==1) print
            keep=1
            next
          }

          { if (keep==1) print }
          ' source.m3u > LIVE2.m3u

          # Safety: ensure valid M3U always exists
          if [ ! -s LIVE2.m3u ]; then
            echo "#EXTM3U" > LIVE2.m3u
          fi

          echo "Cleaned M3U line count:"
          wc -l LIVE2.m3u

      # 4️⃣ Commit & push CLEANED M3U to GitHub
      - name: Commit and push if changed
        run: |
          git config user.name "m3u-bot"
          git config user.email "m3u-bot@users.noreply.github.com"

          git add LIVE2.m3u

          if ! git diff --cached --quiet; then
            git commit -m "Auto update LIVE2.m3u (cleaned safely)"
            git push
          else
            echo "No changes detected"
          fi
